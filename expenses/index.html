<title>Tally Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: ledger left (entry + list), month summary right; stacks on phones */
:root{
  --bg:#f3f5f4;--panel:#fcfcfb;--ink:#14201c;--muted:#5d6b66;--line:#dbe1de;--accent:#0f6b55;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#6250d6;--over:#d03b3b;
  --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101413;--panel:#1a1a19;--ink:#e6ece9;--muted:#93a29c;--line:#2c3330;--accent:#4cc3a0;--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#9085e9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101413;--panel:#1a1a19;--ink:#e6ece9;--muted:#93a29c;--line:#2c3330;--accent:#4cc3a0;--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#9085e9;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding:28px 16px 48px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:20px;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}
@media (max-width:760px){.wrap{grid-template-columns:1fr}}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h1{font:700 2rem/1 var(--display);margin:0;letter-spacing:-.02em}
h2{font:500 .75rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
.month{display:flex;gap:6px;align-items:center;font-family:var(--mono)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.col{display:grid;gap:20px;align-content:start;min-width:0}
form{display:grid;grid-template-columns:2fr 1fr 1.3fr 1.2fr auto;gap:8px}
@media (max-width:560px){form{grid-template-columns:1fr 1fr}form button{grid-column:1/-1}}
input,select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
button{cursor:pointer}
.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:500}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:10px 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:3px}
.meta{color:var(--muted);font-size:.8rem}
.amt,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:var(--muted);padding:4px 6px}
.x:hover{color:var(--over)}
.hero{font:700 2.6rem/1 var(--display);letter-spacing:-.02em}
.hero small{font:500 1rem var(--mono);color:var(--muted)}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:14px 0 6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .4s}
.meter.over i{background:var(--over)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:96px 1fr 84px;gap:10px;align-items:center;font-size:.85rem}
.track{height:12px;position:relative}
.track i{position:absolute;inset:0 auto 0 0;border-radius:0 4px 4px 0;min-width:2px}
.days{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:1px solid var(--line)}
.days i{flex:1;background:var(--c1);border-radius:3px 3px 0 0;min-height:1px;position:relative}
.days i:hover,.days i.on{background:var(--accent)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--panel);font:12px var(--mono);padding:4px 8px;border-radius:4px}
.note{font-size:.8rem;color:var(--muted)}
.empty{color:var(--muted);padding:16px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Tally Book</h1>
    <div class="month"><button id="prev" aria-label="Previous month">‹</button><span id="mlabel"></span><button id="next" aria-label="Next month">›</button></div>
  </header>

  <div class="col">
    <section class="panel">
      <h2>Add an expense</h2>
      <form id="f">
        <input id="desc" placeholder="What for?" required>
        <input id="amount" type="number" min="0.01" step="0.01" placeholder="SAR" required>
        <select id="cat"></select>
        <input id="date" type="date" required>
        <button class="primary">Add</button>
      </form>
    </section>
    <section class="panel">
      <h2>This month's entries</h2>
      <ul class="list" id="list"></ul>
      <p class="note" id="sample" hidden>Showing example entries. Add your own or <button class="x" id="clear">clear examples</button>.</p>
    </section>
  </div>

  <div class="col">
    <section class="panel">
      <h2>Spent this month</h2>
      <div class="hero" id="total"></div>
      <div class="meter" id="meter"><i></i></div>
      <div class="row"><span id="left"></span><label>Budget <input id="budget" type="number" min="0" step="100" style="width:96px;padding:2px 6px" class="num"></label></div>
    </section>
    <section class="panel">
      <h2>By category</h2>
      <div class="bars" id="bars"></div>
    </section>
    <section class="panel">
      <h2>Daily spend</h2>
      <div class="days" id="days"></div>
      <div class="row num"><span>1</span><span id="lastday"></span></div>
    </section>
  </div>
</div>
<div class="tip" id="tip" hidden></div>

<script>
const CATS=["Groceries","Dining","Transport","Bills","Shopping","Fun"];
const $=id=>document.getElementById(id), fmt=n=>n.toLocaleString("en",{minimumFractionDigits:2,maximumFractionDigits:2});
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const now=new Date(), ym=(d)=>d.toISOString().slice(0,7), iso=(y,m,d)=>new Date(Date.UTC(y,m,d)).toISOString().slice(0,10);
function seed(){const y=now.getFullYear(),m=now.getMonth(),r=[["Tamimi Markets",312.5,0,2],["Uber to office",38,2,3],["Al Baik dinner",64,1,5],["STC mobile bill",230,3,6],["Danube weekly shop",287.25,0,9],["Cinema tickets",120,5,11],["Electricity (SEC)",410,3,12],["Jarir — notebook",89,4,14],["Careem rides",72.5,2,16],["Coffee with team",45,1,18]];
  return r.filter(x=>x[3]<=now.getDate()).map((x,i)=>({id:i+1,desc:x[0],amount:x[1],cat:CATS[x[2]],date:iso(y,m,x[3]),sample:true}))}
let items=store.get("tb.items",null)??seed(), budget=store.get("tb.budget",3000), view=new Date(Date.UTC(now.getFullYear(),now.getMonth(),1));
CATS.forEach((c,i)=>$("cat").add(new Option(c,c)));
$("date").value=iso(now.getFullYear(),now.getMonth(),now.getDate()); $("budget").value=budget;
const color=c=>`var(--c${CATS.indexOf(c)+1})`, save=()=>{store.set("tb.items",items);render()};

function render(){
  const key=ym(view), rows=items.filter(e=>e.date.startsWith(key)).sort((a,b)=>b.date.localeCompare(a.date));
  const total=rows.reduce((s,e)=>s+e.amount,0), pct=budget?total/budget:0;
  $("mlabel").textContent=view.toLocaleString("en",{month:"long",year:"numeric",timeZone:"UTC"});
  $("total").innerHTML=`${fmt(total)} <small>SAR</small>`;
  $("meter").className="meter"+(pct>1?" over":""); $("meter").firstChild.style.width=Math.min(pct,1)*100+"%";
  $("left").textContent=budget?(pct>1?`${fmt(total-budget)} SAR over budget`:`${fmt(budget-total)} SAR left · ${Math.round(pct*100)}% used`):"No budget set";
  $("sample").hidden=!items.some(e=>e.sample);
  $("list").innerHTML=rows.length?rows.map(e=>`<li><span class="dot" style="background:${color(e.cat)}"></span><span>${e.desc.replace(/</g,"&lt;")}<br><span class="meta">${e.cat} · ${e.date.slice(8)} ${view.toLocaleString("en",{month:"short",timeZone:"UTC"})}</span></span><span class="amt">${fmt(e.amount)}</span><button class="x" data-id="${e.id}" aria-label="Delete ${e.desc}">✕</button></li>`).join(""):`<li class="empty">Nothing logged this month. Add your first expense above.</li>`;
  const by=CATS.map(c=>[c,rows.filter(e=>e.cat===c).reduce((s,e)=>s+e.amount,0)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]), max=by[0]?.[1]||1;
  $("bars").innerHTML=by.length?by.map(([c,v])=>`<div class="bar"><span>${c}</span><span class="track"><i style="width:${v/max*100}%;background:${color(c)}"></i></span><span class="num" style="text-align:right">${fmt(v)}</span></div>`).join(""):`<p class="empty">Categories appear once you add expenses.</p>`;
  const n=new Date(Date.UTC(view.getUTCFullYear(),view.getUTCMonth()+1,0)).getUTCDate(), day=Array(n).fill(0);
  rows.forEach(e=>day[+e.date.slice(8)-1]+=e.amount); const dm=Math.max(...day)||1;
  $("days").innerHTML=day.map((v,i)=>`<i style="height:${v/dm*100}%" data-t="${i+1}: ${fmt(v)} SAR"></i>`).join(""); $("lastday").textContent=n;
}
$("f").onsubmit=e=>{e.preventDefault();items=items.filter(x=>!x.sample);items.push({id:Date.now(),desc:$("desc").value.trim(),amount:+$("amount").value,cat:$("cat").value,date:$("date").value});$("desc").value=$("amount").value="";view=new Date($("date").value.slice(0,7)+"-01T00:00Z");save();$("desc").focus()};
$("list").onclick=e=>{const id=e.target.dataset.id;if(id){items=items.filter(x=>x.id!=id);save()}};
$("clear").onclick=()=>{items=items.filter(x=>!x.sample);save()};
$("budget").oninput=e=>{budget=+e.target.value||0;store.set("tb.budget",budget);render()};
$("prev").onclick=()=>{view.setUTCMonth(view.getUTCMonth()-1);render()}; $("next").onclick=()=>{view.setUTCMonth(view.getUTCMonth()+1);render()};
$("days").onmousemove=e=>{const t=e.target.dataset.t,tip=$("tip");tip.hidden=!t;if(t){tip.textContent=t;tip.style.left=e.clientX+10+"px";tip.style.top=e.clientY-28+"px"}};
$("days").onmouseleave=()=>$("tip").hidden=true;
render();
</script>
